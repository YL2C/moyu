name: Verify chat backup
on:
  push:
    branches: [codex/verify-chat-backup]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: python3 -B tests/cloud-backup-server.test.py
